<!DOCTYPE html>
<html lang="id">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>I LOVE YOU</title>
        <script src="https://unpkg.com/feather-icons"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="style_memories.css">
</head>
<body>
    <div id="loading">
        <div class="love-loader">💖</div>
        <h2>Loading Memories</h2>
        <div id="progress">0%</div>
    </div>
    <div id="container"></div>
    <div class="overlay"></div>
    <div class="pesan position-absolute top-50 start-50 translate-middle">
        <a href="index.html" class="text-light position-absolute start-0 top-0 m-2 mt-5">
            <i data-feather="arrow-left"></i>
        </a>
        
        <div class="card position-absolute top-50 start-50 translate-middle" id="pesan">
            <a onclick="hide()" class="hide-btn text-light position-absolute end-0 top-0 m-2" id="toggleCard">
                    <i data-feather="eye-off"></i>
            </a>
            <div class="card-header" align="center">
                <h2>❤️Our Memories❤️</h2>
            </div>
            <div class="card-body">
                <p>banyak banget momen yang kita lewatin bareng, aku ga tau mau ngomong apa lagi, but makasih udah selalu ada.</p>
                <div class="signature">
                    — Cakra ❤️
                </div>
                <div align="center">
                    <button class="btn" onclick="window.location.href='list.html'">Continue -></button>
                </div>
            </div>
        </div>

        <button onclick="show()" id="showCard" class="tampil-card">
            ❤️ Show Message
        </button>
        
    </div>
    <script>
      feather.replace();
    </script>
    <script src="script_memories.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
